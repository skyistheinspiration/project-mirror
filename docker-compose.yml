
services:

  backend:
    build:
      context: ./fastapi-backend
    container_name: mirror-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/digital_twin.db
      FASTAPI_PORT: "8001"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - mirror_db:/app/data
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
    container_name: mirror-frontend
    restart: unless-stopped
    expose:
      - "80"

  gateway:
    image: nginx:alpine
    container_name: mirror-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mirror_db:

